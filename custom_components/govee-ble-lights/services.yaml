set_speed:
  name: Set strip speed
  description: >-
    Set this strip's scene speed. Applies immediately to the current effect and
    persists across restarts. Speed "feel" is per-scene: the byte's direction and
    range depend on the scene's colour type, so the same level looks different
    across scenes.
  target:
    entity:
      integration: govee-ble-lights
      domain: light
  fields:
    speed_index:
      name: Speed
      description: >-
        An integer level (0 = liveliest; higher = calmer, range varies per
        scene), "auto" (follow the scene's saved/Govee-recommended speed), or
        "off" (upload the scene baseline untouched).
      required: true
      example: "auto"
      selector:
        text:

set_move:
  name: Set movement speed (experimental)
  description: >-
    Force this strip's raw movement-speed byte (moveIn + moveAll) on every
    scene segment, bypassing Govee's curated speed table to reach the off-menu
    range (0-255) the strip still honours. Use it to animate "band-scroll"
    scenes such as Festival - Carnival, whose Govee-exposed values (229-252) all
    render static on the H617A. Applies immediately to the current effect and
    persists across restarts. Lower/higher is per-scene; sweep to taste.
  target:
    entity:
      integration: govee-ble-lights
      domain: light
  fields:
    move:
      name: Movement byte
      description: >-
        An integer 0-255 written to the movement-speed fields, or "off" to clear
        the override and return to the normal table-based speed.
      required: true
      example: 40
      selector:
        text:

set_scene_speed:
  name: Set scene speed preset
  description: >-
    Save (or clear) a per-scene speed preset for this strip's current effect. An
    integer pins that scene's speed for every strip that's on "auto"; "auto"
    clears the preset back to Govee's default. Presets persist to Home Assistant
    storage.
  target:
    entity:
      integration: govee-ble-lights
      domain: light
  fields:
    speed_index:
      name: Speed
      description: >-
        An integer to pin this scene's speed (0 = liveliest; higher = calmer),
        or "auto" to clear the preset back to Govee's per-scene default.
      required: true
      example: "auto"
      selector:
        text:
